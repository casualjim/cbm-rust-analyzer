redactions = ["*_TOKEN", "*_SECRET", "*_KEY", "*_PASSWORD"]

[plugins]
fnox-env = "https://github.com/jdx/mise-env-fnox"

[settings]
env_shell_expand = true
lockfile = true

[tools]
"cargo:cargo-dist" = "0.32.0"
"cargo:cargo-xwin" = "0.22.0"
fnox = "latest"

[tools.rust]
version = "latest"
profile = "default"
components = "llvm-tools,rust-analyzer"
