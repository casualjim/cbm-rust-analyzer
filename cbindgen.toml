language = "C"
include_guard = "RUST_ANALYZER_LSP_H"
cpp_compat = true
header = "/* Generated by cbindgen from src/capi.rs. Do not edit by hand. */"

[export]
include = [
  "RustAnalyzerStatus",
  "RustAnalyzerCall",
  "RustAnalyzerImport",
  "RustAnalyzerFile",
  "RustAnalyzerDefSite",
  "RustAnalyzerResolvedCall",
  "RustAnalyzerResolvedCallArray",
  "rust_analyzer_resolve_batch",
  "rust_analyzer_free_resolved_call_array",
]

[parse]
parse_deps = false
